name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SCiOMaterialMemoryAndroid_v1

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7

      - name: Configura Java 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verifica Gradle Wrapper
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Test e compilazione Gradle
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Verifica app-debug.apk
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Salva APK
        uses: actions/upload-artifact@v7
        with:
          name: SCiO-Material-Memory-debug-apk
          path: SCiOMaterialMemoryAndroid_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
